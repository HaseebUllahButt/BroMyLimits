<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent Usage</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f7fa;
    --surface: #ffffff;
    --surface-2: #eef2f6;
    --surface-3: #e3e9ef;
    --border: #dfe5eb;
    --border-strong: #c9d3dd;
    --ink: #1a1917;
    --ink-soft: #3d3a34;
    --ink-dim: #667384;
    --ink-faint: #98a5b3;
    --accent: #c65f2d;
    --accent-2: #28799b;
    --accent-3: #7355a8;
    --accent-4: #2f8f6b;
    --accent-2-soft: rgba(40, 121, 155, 0.1);
    /* A softer categorical palette for account/report charts. These stay
       distinct without relying on the more urgent status colors below. */
    --report-1: #cf725f;
    --report-2: #3e8ea0;
    --report-3: #7a6fb0;
    --report-4: #649478;
    --report-5: #b28b4f;
    --report-6: #a36c88;
    --report-7: #687f98;
    --good: #31834a;
    --warn: #bd751f;
    --bad: #bf493f;
    --radius: 11px;
    --radius-lg: 16px;
    --shadow-xs: 0 1px 2px rgba(36, 52, 68, 0.04);
    --shadow-sm: 0 1px 2px rgba(36, 52, 68, 0.05), 0 8px 24px -14px rgba(36, 52, 68, 0.28);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --font: "DM Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10151b;
      --surface: #182029;
      --surface-2: #202b36;
      --surface-3: #2a3743;
      --border: #2d3b48;
      --border-strong: #405261;
      --ink: #eef4f8;
      --ink-soft: #cbd6df;
      --ink-dim: #94a4b3;
      --ink-faint: #61717f;
      --accent: #ed8b54;
      --accent-2: #70c2e5;
      --accent-3: #b69be8;
      --accent-4: #66cf9d;
      --accent-2-soft: rgba(112, 194, 229, 0.13);
      --report-1: #e58b76;
      --report-2: #67b6c0;
      --report-3: #9e91d1;
      --report-4: #83b391;
      --report-5: #d5ae70;
      --report-6: #c48fae;
      --report-7: #9eb7ce;
      --good: #78c98b;
      --warn: #efa75c;
      --bad: #ee8278;
      --shadow-xs: 0 1px 0 rgba(0, 0, 0, 0.25);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25), 0 6px 16px -8px rgba(0, 0, 0, 0.4);
    }
  }

  :root[data-theme="dark"] {
    --bg: #10151b; --surface: #182029; --surface-2: #202b36; --surface-3: #2a3743;
    --border: #2d3b48; --border-strong: #405261;
    --ink: #eef4f8; --ink-soft: #cbd6df; --ink-dim: #94a4b3; --ink-faint: #61717f;
    --accent: #ed8b54; --accent-2: #70c2e5; --accent-3: #b69be8; --accent-4: #66cf9d;
    --accent-2-soft: rgba(112, 194, 229, 0.13);
    --report-1: #e58b76; --report-2: #67b6c0; --report-3: #9e91d1;
    --report-4: #83b391; --report-5: #d5ae70; --report-6: #c48fae; --report-7: #9eb7ce;
    --good: #78c98b; --warn: #efa75c; --bad: #ee8278;
    --shadow-xs: 0 1px 0 rgba(0, 0, 0, 0.25);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25), 0 6px 16px -8px rgba(0, 0, 0, 0.4);
  }

  :root[data-theme="light"] {
    --bg: #f5f7fa; --surface: #ffffff; --surface-2: #eef2f6; --surface-3: #e3e9ef;
    --border: #dfe5eb; --border-strong: #c9d3dd;
    --ink: #1c2732; --ink-soft: #3b4a58; --ink-dim: #667384; --ink-faint: #98a5b3;
    --accent: #c65f2d; --accent-2: #28799b; --accent-3: #7355a8; --accent-4: #2f8f6b;
    --accent-2-soft: rgba(40, 121, 155, 0.1);
    --report-1: #cf725f; --report-2: #3e8ea0; --report-3: #7a6fb0;
    --report-4: #649478; --report-5: #b28b4f; --report-6: #a36c88; --report-7: #687f98;
    --good: #31834a; --warn: #bd751f; --bad: #bf493f;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.45;
    font-feature-settings: "ss01", "cv11", "tnum";
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -20%, color-mix(in srgb, var(--accent) 6%, transparent), transparent 70%),
      radial-gradient(ellipse 60% 40% at 100% 100%, color-mix(in srgb, var(--accent-2) 4%, transparent), transparent 60%);
  }

  /* Full viewport shell — no page scroll */
  .shell {
    position: relative;
    z-index: 1;
    height: 100vh;
    height: 100dvh;
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 1.25rem 0.85rem;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  .navbar {
    flex: none;
    z-index: 20;
    margin: 0 -1.25rem;
    padding: 0 1.25rem;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(14px) saturate(1.15);
    -webkit-backdrop-filter: blur(14px) saturate(1.15);
    border-bottom: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
  }
  .navbar-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    height: 3.25rem;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    margin: 0;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .brand-mark {
    width: 1.3rem;
    height: 1.3rem;
    border-radius: 6px;
    background: linear-gradient(145deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--accent-2)));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
    flex: none;
  }
  .updated {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.74rem;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }
  .updated::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--good);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 16%, transparent);
    animation: live 2.4s var(--ease) infinite;
  }
  @keyframes live {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .tabs {
    display: flex;
    gap: 0.3rem;
    padding: 0 0 0.7rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    appearance: none;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    flex: none;
    padding: 0.4rem 0.8rem;
    border: 1px solid transparent;
    border-radius: 999px;
    background: transparent;
    color: var(--ink-dim);
    font: inherit;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: color 0.15s var(--ease), background 0.15s var(--ease), border-color 0.15s var(--ease);
  }
  .tab .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex: none;
  }
  .dot.anthropic { background: var(--report-1); }
  .dot.openai { background: var(--report-3); }
  .dot.google { background: var(--report-2); }
  .dot.xai { background: var(--report-6); }
  .dot.devin { background: var(--report-5); }
  .dot.opencode { background: var(--report-4); }
  .tab:hover {
    color: var(--ink-soft);
    background: color-mix(in srgb, var(--surface-2) 70%, transparent);
  }
  .tab.active {
    color: var(--ink);
    background: var(--surface);
    border-color: var(--border);
    box-shadow: var(--shadow-xs);
  }
  .tab.active .dot {
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--tab-accent, var(--accent)) 18%, transparent);
  }
  .tab.settings-tab {
    margin-left: auto;
    color: var(--ink-faint);
  }
  .tab.report-tab .dot { background: var(--good); }
  .tab.settings-tab:hover,
  .tab.settings-tab.active { color: var(--ink-dim); }

  /* Main fills remaining viewport */
  main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding-top: 1.15rem;
  }

  .panel {
    display: none;
    flex: 1;
    min-height: 0;
    flex-direction: column;
    overflow: hidden;
  }
  .panel.active {
    display: flex;
    animation: rise 0.28s var(--ease);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: none; }
  }

  .panel-heading {
    flex: none;
    display: flex;
    align-items: center;
    gap: 0.45rem;
    margin: 0 0 0.85rem;
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: -0.025em;
  }
  .usage-sources {
    margin: -0.35rem 0 0.8rem;
    color: var(--ink-dim);
    font-size: 0.78rem;
  }
  .panel-heading .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--tab-accent, var(--accent)) 14%, transparent);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1rem 1.1rem;
    box-shadow: var(--shadow-sm);
    flex: none;
  }
  .card.models-card {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    margin-top: 0.75rem;
    overflow: hidden;
  }
  .models-card .table-scroll {
    overflow: auto;
    scrollbar-width: thin;
  }
  .card-title {
    margin: 0 0 0.7rem;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    flex: none;
  }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.6rem;
    margin: 0.75rem 0 0;
    flex: none;
  }
  @media (max-width: 640px) {
    .stat-row { grid-template-columns: repeat(2, 1fr); }
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.7rem 0.8rem;
    box-shadow: var(--shadow-xs);
  }
  .stat .label {
    font-size: 0.67rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    margin-bottom: 0.2rem;
  }
  .stat .value {
    font-family: var(--mono);
    font-size: 1.18rem;
    font-weight: 500;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
  }
  .stat .sub {
    margin-top: 0.15rem;
    font-size: 0.7rem;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }
  .limits-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    margin-bottom: 0.7rem;
  }
  .limits-head .card-title { margin: 0; }
  .refresh-btn {
    appearance: none;
    padding: 0.34rem 0.75rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--ink-dim);
    font: inherit;
    font-size: 0.72rem;
    font-weight: 500;
    cursor: pointer;
    transition: color 0.15s var(--ease), background 0.15s var(--ease), border-color 0.15s var(--ease);
  }
  .refresh-btn:hover {
    color: var(--ink);
    background: var(--surface);
    border-color: var(--border-strong);
  }
  .refresh-btn:disabled { opacity: 0.5; cursor: default; }
  .limits-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.85rem 1.5rem;
  }
  .limit-item .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.5rem;
    margin-bottom: 0.45rem;
    font-size: 0.86rem;
    font-weight: 500;
    color: var(--ink-soft);
  }
  .limit-item .head .pct {
    font-family: var(--mono);
    font-size: 0.9rem;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .limit-item .bar-track {
    height: 7px;
    border-radius: 999px;
    background: var(--surface-3);
    overflow: hidden;
  }
  .limit-item .bar-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--good);
    transition: width 0.5s var(--ease);
  }
  .limit-item .bar-fill.warn { background: var(--warn); }
  .limit-item .bar-fill.bad { background: var(--bad); }
  .limit-item .reset {
    margin-top: 0.4rem;
    font-size: 0.72rem;
    color: var(--ink-dim);
  }
  .limit-stale {
    margin-top: 0.65rem;
    font-size: 0.72rem;
    color: var(--ink-dim);
    line-height: 1.4;
  }
  .manual-reset { color: var(--accent-2); }

  /* Table area never scrolls — the whole page fits the viewport */
  .table-scroll {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    margin: 0 -0.15rem;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
  }
  th, td {
    text-align: left;
    padding: 0.45rem 0.5rem;
    border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  th {
    color: var(--ink-dim);
    font-weight: 500;
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 1;
  }
  td:not(:first-child), th:not(:first-child) { text-align: right; }
  tbody tr:hover { background: color-mix(in srgb, var(--surface-2) 65%, transparent); }
  tr:last-child td { border-bottom: none; }
  td.model-name {
    white-space: normal;
    max-width: 280px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  td.total-col, th.total-col { font-weight: 600; }
  .tok-sub {
    display: block;
    margin-top: 1px;
    font-size: 0.62rem;
    font-weight: 400;
    color: var(--ink-dim);
    font-family: var(--mono);
  }
  td:not(:first-child),
  tr.totals-row td:not(:first-child) {
    font-family: var(--mono);
    font-size: 0.74rem;
  }
  tr.totals-row td {
    border-top: 1px solid var(--border-strong);
    border-bottom: none;
    font-weight: 600;
    padding-top: 0.5rem;
    background: color-mix(in srgb, var(--surface-2) 45%, transparent);
  }
  tr.totals-row td.total-col { color: var(--accent); }

  .pill {
    display: inline-block;
    margin-left: 0.35rem;
    padding: 0.08rem 0.4rem;
    border-radius: 999px;
    font-size: 0.58rem;
    font-weight: 600;
    vertical-align: middle;
  }
  .pill.unpriced {
    background: color-mix(in srgb, var(--bad) 12%, transparent);
    color: var(--bad);
    border: 1px solid color-mix(in srgb, var(--bad) 28%, transparent);
  }

  .empty {
    color: var(--ink-dim);
    font-size: 0.84rem;
    line-height: 1.5;
  }

  footer {
    flex: none;
    margin-top: 0.5rem;
    text-align: center;
    color: var(--ink-faint);
    font-size: 0.7rem;
    letter-spacing: 0.02em;
  }

  /* Settings fits viewport too */
  .settings-lead {
    flex: none;
    margin: 0 0 0.65rem;
    color: var(--ink-dim);
    font-size: 0.88rem;
    line-height: 1.45;
    max-width: 36rem;
  }
  .settings-body {
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  /* Aggregate report — fills viewport, no page scroll */
  .report-body {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    overflow: hidden;
  }
  .report-hero {
    flex: none;
    display: grid;
    grid-template-columns: minmax(300px, 1.15fr) minmax(230px, 0.85fr);
    gap: 0.75rem;
    align-items: stretch;
  }
  .bars-card { display: flex; flex-direction: column; gap: 0.55rem; justify-content: center; }
  .bar-chart-empty { min-height: 96px; display: flex; align-items: center; }
  .bar-row + .bar-row { margin-top: 0.55rem; }

  .donut-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.4rem;
    min-height: 0;
  }
  .donut-box {
    position: relative;
    width: 144px;
    height: 144px;
    flex: none;
    animation: donut-pop 0.45s var(--ease);
  }
  @keyframes donut-pop {
    from { opacity: 0; transform: scale(0.94); }
    to { opacity: 1; transform: none; }
  }
  .donut-box svg { width: 100%; height: 100%; display: block; }
  .donut-seg {
    cursor: pointer;
    transition:
      opacity 0.18s var(--ease),
      filter 0.18s var(--ease),
      stroke-dasharray 0.6s var(--ease),
      stroke-dashoffset 0.6s var(--ease);
    animation: donut-draw 0.7s var(--ease) backwards;
  }
  @keyframes donut-draw {
    from { stroke-dasharray: 0 999; }
  }
  .donut-seg:hover,
  .donut-seg.pinned { filter: brightness(1.14); }
  .donut-seg.donut-fade { opacity: 0.2; }
  .donut-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 0 12px;
    overflow: hidden;
    text-align: center;
    pointer-events: none;
  }
  .donut-total {
    font: 600 1.1rem/1 var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    transition: color 0.18s var(--ease);
  }
  .donut-label {
    font-size: 0.6rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
  }
  .donut-detail-name {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 0.58rem;
    font-weight: 600;
    color: var(--ink-soft);
  }
  .donut-detail-meta {
    font: 400 0.56rem/1 var(--mono);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    color: var(--ink-dim);
  }
  .donut-legend {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.3rem;
  }
  .donut-legend-row {
    margin: 0 -0.45rem;
    padding: 0.3rem 0.45rem;
    border-radius: 10px;
    transition: background 0.15s var(--ease), opacity 0.18s var(--ease);
    animation: legend-in 0.45s var(--ease) backwards;
  }
  @keyframes legend-in {
    from { opacity: 0; transform: translateY(3px); }
    to { opacity: 1; transform: none; }
  }
  .donut-legend-row:hover { background: color-mix(in srgb, var(--surface-2) 75%, transparent); }
  .donut-legend-row.pinned { background: color-mix(in srgb, var(--surface-2) 95%, transparent); }
  .donut-legend-row.donut-fade { opacity: 0.3; }
  .donut-legend-row .bar-row-head { margin-bottom: 0.25rem; }
  .donut-legend-row .bar-row-val { flex: none; }
  .donut-legend-bar { display: flex; align-items: center; gap: 0.5rem; }
  .donut-legend-bar .bar-chart-track { flex: 1; }
  .donut-legend-pct { flex: none; min-width: 2.8em; text-align: right; font: 0.66rem var(--mono); color: var(--ink-dim); }
  .donut-legend .bar-chart-track { transition: opacity 0.18s var(--ease); }
  .donut-legend-row:hover .bar-chart-fill { filter: brightness(1.12); }
  .bar-row-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.6rem;

<div class="shell">
  <header class="navbar">

      <div class="updated" id="updated">loading…</div>

  <footer id="footer">Local · refreshes every 30s · costs from real tokens × published rates</footer>
