<script>
const fmt$ = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const fmt$4 = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 4, maximumFractionDigits: 4 });
const fmtTok = n => {
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e8 ? 0 : 1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
  return String(n || 0);
};

const dotClass = provider => provider === 'claude' ? 'anthropic' : provider === 'grok' ? 'xai' : provider === 'antigravity' ? 'google' : provider === 'opencode' ? 'opencode' : provider === 'devin' ? 'devin' : 'openai';
const accentVar = provider => provider === 'claude' ? '--report-1' : provider === 'grok' ? '--report-6' : provider === 'antigravity' ? '--report-2' : provider === 'opencode' ? '--report-4' : provider === 'devin' ? '--report-5' : '--report-3';
const providerName = provider => provider === 'claude' ? 'Claude Code' : provider === 'grok' ? 'Grok CLI' : provider === 'antigravity' ? 'Antigravity' : provider === 'opencode' ? 'OpenCode' : provider === 'devin' ? 'Devin' : 'Codex CLI';
const accountTitle = a => {
  const lbl = (a.label || '').includes('@') ? 'default' : (a.label || 'default');
  return `${providerName(a.provider)} — ${lbl}`;
};

let builtForIds = null;
let lastAllAccounts = [];

const HIDDEN_KEY = 'cc-usage-hidden-accounts';
const ACTIVE_TAB_KEY = 'cc-usage-active-tab';
const REPORT_EXCLUDED_KEY = 'cc-usage-report-excluded-accounts';
function getHidden() {
  try { return new Set(JSON.parse(localStorage.getItem(HIDDEN_KEY) || '[]')); } catch { return new Set(); }
}
function setHidden(set) {
  localStorage.setItem(HIDDEN_KEY, JSON.stringify([...set]));
}
function getActiveTab() {
  try { return localStorage.getItem(ACTIVE_TAB_KEY); } catch { return null; }
}
function setActiveTab(id) {
  try { localStorage.setItem(ACTIVE_TAB_KEY, id); } catch {}
}
function getReportExcluded() {
  try { return new Set(JSON.parse(localStorage.getItem(REPORT_EXCLUDED_KEY) || '[]')); } catch { return new Set(); }
}
function setReportAccount(accountId, included) {
  const excluded = getReportExcluded();
  if (included) excluded.delete(accountId); else excluded.add(accountId);
  localStorage.setItem(REPORT_EXCLUDED_KEY, JSON.stringify([...excluded]));
  const totalPanel = document.getElementById('panel-total');
  if (totalPanel) setHtml(totalPanel, totalReportHtml(lastAllAccounts));
}
function toggleHidden(accountId, visible) {
  const hidden = getHidden();
  if (visible) hidden.delete(accountId); else hidden.add(accountId);
  setHidden(hidden);
  builtForIds = null;
  render({ accounts: lastAllAccounts, fetchedAt: lastFetchedAt });
}

function settingsPanelHtml(accounts) {
  const hidden = getHidden();
  const byProvider = { claude: [], codex: [], grok: [], antigravity: [], opencode: [], devin: [] };
  for (const a of accounts) (byProvider[a.provider] || (byProvider[a.provider] = [])).push(a);

  const rows = (list) => list.map(a => `
    <div class="toggle-row">
      <span class="who"><span class="dot ${dotClass(a.provider)}"></span>${accountTitle(a)}</span>
      <label class="switch">
        <input type="checkbox" data-toggle-account="${a.id}" ${hidden.has(a.id) ? '' : 'checked'} />
        <span class="track"></span>
      </label>
    </div>`).join('');

  const section = (title, list) => list.length ? `
    <div class="card" style="margin-bottom:0.55rem">
      <h2 class="card-title">${title}</h2>
      ${rows(list)}
    </div>` : '';

  return `
    <div class="panel-heading">Settings</div>
    <p class="settings-lead">Choose which accounts appear as tabs. Hidden accounts keep tracking in the background.</p>
    <div class="settings-body">
      ${section('Claude Code', byProvider.claude)}
      ${section('Codex CLI', byProvider.codex)}
      ${section('Antigravity', byProvider.antigravity)}
      ${section('Grok CLI', byProvider.grok)}
      ${section('OpenCode', byProvider.opencode)}
      ${section('Devin', byProvider.devin)}
    </div>
  `;
}

const reportColors = [
  'var(--report-1)', 'var(--report-2)', 'var(--report-3)', 'var(--report-4)',
  'var(--report-5)', 'var(--report-6)', 'var(--report-7)',
];

function sumPeriod(accounts, period) {
  return accounts.reduce((total, account) => {
    const value = account[period] || {};
    total.cost += Number(value.cost) || 0;
    total.tokens += Number(value.tokens) || 0;
    return total;
  }, { cost: 0, tokens: 0 });
}

function modelHasUsage(model) {
  const tokenTotal = Object.values(model?.tokens || {}).reduce((sum, value) => sum + (Number(value) || 0), 0);
  return tokenTotal > 0 || (Number(model?.cost?.total) || 0) > 0;
}

function accountTotals(account) {
  const models = (account.models || []).filter(modelHasUsage);
  const channels = models.reduce((sum, model) => {
    for (const key of ['input', 'output', 'cacheWrite', 'cacheRead']) {
      sum.tokens[key] += Number(model.tokens?.[key]) || 0;
      sum.cost[key] += Number(model.cost?.[key]) || 0;
    }
    return sum;
  }, { tokens: { input: 0, output: 0, cacheWrite: 0, cacheRead: 0 }, cost: { input: 0, output: 0, cacheWrite: 0, cacheRead: 0 } });
  return {
    cost: Number(account.allTime?.cost) || 0,
    tokens: Number(account.allTime?.tokens) || 0,
    channels,
    models: models.length,
  };
}

function topModels(accounts) {
  const models = new Map();
  for (const account of accounts) {
    for (const model of account.models || []) {
      if (!modelHasUsage(model)) continue;
      const row = models.get(model.modelName) || { name: model.modelName, tokens: 0, cost: 0, accounts: new Set() };
      row.tokens += ['input', 'output', 'cacheWrite', 'cacheRead'].reduce((sum, key) => sum + (Number(model.tokens?.[key]) || 0), 0);
      row.cost += Number(model.cost?.total) || 0;
      row.accounts.add(account.id);
      models.set(model.modelName, row);
    }
  }
  return [...models.values()].sort((a, b) => b.tokens - a.tokens).slice(0, 5);
}

const reportRangeOf = () => {
  const value = Number(localStorage.getItem('ccu-report-range'));
  return [1, 7, 30].includes(value) ? value : 30;
};
const reportSetRange = (days) => localStorage.setItem('ccu-report-range', String(days));

function dateKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function dateDaysAgo(days) {
  const date = new Date();
  date.setHours(12, 0, 0, 0);
  date.setDate(date.getDate() - days);
  return date;
}

function usageTrendHtml(accounts, days) {
  const keys = Array.from({ length: days }, (_, index) => dateKey(dateDaysAgo(days - index - 1)));
  const previousKeys = new Set(Array.from({ length: days }, (_, index) => dateKey(dateDaysAgo(days * 2 - index - 1))));
  const byAccount = accounts.map(account => {
    const daily = new Map((account.daily || []).map(row => [row.date, Number(row.tokens) || 0]));
    return { account, daily };
  });
  const totals = keys.map(key => byAccount.reduce((sum, row) => sum + (row.daily.get(key) || 0), 0));
  const current = totals.reduce((sum, value) => sum + value, 0);
  const previous = byAccount.reduce((sum, row) => {
    for (const [key, value] of row.daily) if (previousKeys.has(key)) sum += value;
    return sum;
  }, 0);
  // Only compare against a prior period the dashboard actually has data for;
  // one that predates tracking reads as a spurious several-hundred-% jump.
  const firstDay = byAccount.reduce((min, row) => {
    for (const key of row.daily.keys()) if (!min || key < min) min = key;
    return min;
  }, null);
  const priorCovered = firstDay && firstDay <= dateKey(dateDaysAgo(days * 2 - 1));
  const delta = previous && priorCovered ? ((current - previous) / previous) * 100 : null;

  const W = 760, H = 300, left = 56, right = 10, top = 14, bottom = 28;
  const plotW = W - left - right, plotH = H - top - bottom;
  const max = Math.max(1, ...totals);
  const x = index => days === 1 ? left + plotW / 2 : left + index * (plotW / (days - 1));
  const y = value => top + plotH - (value / max) * plotH;
  const points = totals.map((value, index) => `${x(index).toFixed(2)},${y(value).toFixed(2)}`).join(' ');
  const tickIndexes = [...new Set([0, Math.floor((days - 1) / 3), Math.floor((days - 1) * 2 / 3), days - 1])];
  const dateLabel = key => new Date(`${key}T12:00:00`).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  const deltaHtml = delta == null
    ? `No full prior ${days}d period to compare yet`
    : `<span class="${delta > 0 ? 'trend-up' : delta < 0 ? 'trend-down' : ''}">${delta > 0 ? '+' : ''}${delta.toFixed(0)}%</span> vs previous ${days}d`;

  return `<div class="card trend-card">
    <div class="trend-head">
      <div>
        <h2 class="card-title">Total tokens · ${days === 1 ? 'today' : `${days} days`}</h2>
        <div class="trend-total">${fmtTok(current)}</div>
        <div class="trend-meta">${fmtTok(current / days)} daily average · ${deltaHtml}</div>
      </div>
      <div class="trend-toolbar" aria-label="Token chart range">
        ${[1, 7, 30].map(range => `<button class="eco-toggle${range === days ? ' active' : ''}" data-report-range="${range}">${range}d</button>`).join('')}
      </div>
    </div>
    <svg class="trend-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Total tokens for the last ${days} day${days === 1 ? '' : 's'}">
      ${[0, 0.5, 1].map(part => {
        const yy = top + plotH * part;
        const value = max * (1 - part);
        return `<line class="trend-grid" x1="${left}" y1="${yy}" x2="${W - right}" y2="${yy}"></line><text class="trend-axis" x="${left - 6}" y="${yy + 3}" text-anchor="end">${fmtTok(value)}</text>`;
      }).join('')}
      <polyline class="trend-line" points="${points}"></polyline>
      ${totals.map((value, index) => `<circle class="trend-dot" cx="${x(index)}" cy="${y(value)}" r="${days === 1 ? 5 : 3}"><title>${keys[index]}: ${fmtTok(value)} tokens</title></circle>`).join('')}
      ${tickIndexes.map(index => `<text class="trend-axis" x="${x(index)}" y="${H - 7}" text-anchor="${days > 1 && index === 0 ? 'start' : days > 1 && index === days - 1 ? 'end' : 'middle'}">${dateLabel(keys[index])}</text>`).join('')}
    </svg>
  </div>`;
}

function donutChartHtml(rows, grandCost, grandTokens, metric = 'cost') {
  const isTok = metric === 'tokens';
  const total = isTok ? (grandTokens || 0) : (grandCost || 0);
  const segments = rows
    .filter(row => (isTok ? row.tokens : row.cost) > 0)
    .sort((a, b) => isTok ? b.tokens - a.tokens : b.cost - a.cost);
  const R = 54;
  const C = 2 * Math.PI * R;
  let acc = 0;
  const arcs = segments.map((row, i) => {
    const val = isTok ? row.tokens : row.cost;
    const frac = total ? val / total : 0;
    const dash = Math.max(frac * C - (segments.length > 1 ? 1.5 : 0), 0);
    const off = -acc * C;
    acc += frac;
    const color = reportColors[row.index % reportColors.length];
    return `<circle class="donut-seg" data-seg-index="${i}" data-name="${esc(accountTitle(row.account))}" data-cost="${esc(fmt$(row.cost))}" data-pct="${(frac * 100).toFixed(1)}" data-tokens="${esc(fmtTok(row.tokens))}" style="animation-delay:${i * 0.06}s" r="${R}" cx="64" cy="64" fill="none" stroke="${color}" stroke-width="17" stroke-linecap="butt" stroke-dasharray="${dash} ${C - dash}" stroke-dashoffset="${off}" transform="rotate(-90 64 64)"></circle>`;
  }).join('');
  const legend = segments.map((row, i) => {
    const val = isTok ? row.tokens : row.cost;
    const frac = total ? val / total : 0;
    const share = frac * 100;
    const color = reportColors[row.index % reportColors.length];
    const valDisplay = isTok ? fmtTok(row.tokens) : fmt$(row.cost);
    return `
    <div class="bar-row donut-legend-row" data-legend-index="${i}" data-name="${esc(accountTitle(row.account))}" data-cost="${esc(fmt$(row.cost))}" data-pct="${share.toFixed(1)}" data-tokens="${esc(fmtTok(row.tokens))}" style="animation-delay:${0.1 + i * 0.05}s">
      <div class="bar-row-head">
        <span class="bar-row-name" title="${esc(accountTitle(row.account))}"><span class="legend-swatch" style="background:${color}"></span><span class="bar-row-label">${accountTitle(row.account)}</span></span>
        <span class="bar-row-val">${valDisplay}</span>
      </div>
      <div class="donut-legend-bar"><div class="bar-chart-track"><div class="bar-chart-fill" style="width:${share}%;background:${color}"></div></div><span class="donut-legend-pct">${share.toFixed(1)}%</span></div>
    </div>`;
  }).join('');
  if (!segments.length) return '<div class="bar-chart-empty"><span class="empty">No usage yet</span></div>';
  const centerDefault = `<span class="donut-total">${isTok ? fmtTok(total) : fmt$(total)}</span><span class="donut-label">${isTok ? 'total tokens' : 'all time'}</span>`;
  return `
    <div class="donut-wrap" data-donut-metric="${metric}">
      <div class="donut-box">
        <svg viewBox="0 0 128 128" role="img" aria-label="${isTok ? 'Tokens' : 'Cost'} by account">
          <circle cx="64" cy="64" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="17"></circle>
          ${arcs}
        </svg>
        <div class="donut-center" data-default-center="${esc(centerDefault)}">${centerDefault}</div>
      </div>
      <div class="donut-legend">${legend}</div>
    </div>`;
}

// How much of what was sent to the models came back out of their prompt cache,
// and what that was worth. A cached input token bills at a fraction of a fresh
// one, so on agent sessions - where the same context is resent every turn -
// this ratio is most of the difference between the bill and what it could have
// been. Providers that report only a billed total (OpenCode) or a tick cost
// (Grok) contribute their tokens and abstain from the money.
function promptCacheHtml(accounts) {
  let fresh = 0, read = 0, write = 0, saved = 0, premium = 0, wouldCost = 0;
  let unpriced = false;
  const rows = [];
  for (const a of accounts) {
    const c = a.cache;
    if (!c || (!c.cacheRead && !c.freshInput)) continue;
    fresh += c.freshInput; read += c.cacheRead; write += c.cacheWrite;
    saved += c.savedUsd; premium += c.writePremiumUsd; wouldCost += c.wouldHaveCostUsd;
    unpriced = unpriced || c.unpriced;
    rows.push({ name: accountTitle(a), hit: c.hitRate, saved: c.netSavedUsd, provider: a.provider });
  }
  if (!rows.length) return '';
  rows.sort((x, y) => y.saved - x.saved || y.hit - x.hit);
  const denom = fresh + read;
  const hit = denom ? read / denom : 0;
  const net = saved - premium;
  const spent = accounts.reduce((sum, a) => sum + (a.allTime?.cost || 0), 0);

  const best = rows[0];
  return `<div class="card cache-card" title="${fmtTok(read)} cached reads, ${fmtTok(write)} cache writes, ${fmtTok(fresh)} fresh input">
      <h2 class="card-title">Prompt cache · all time</h2>
      <div class="cache-hero">
        <span class="big">${(hit * 100).toFixed(1)}%</span>
        <span class="cap">of input tokens served from cache</span>
      </div>
      <div class="cache-meter"><span style="width:${(hit * 100).toFixed(1)}%"></span></div>
      <div class="cache-note">
        Saved <span class="cache-saved">${fmt$(net)}</span>:
        ${fmt$(spent)} spent, not ${fmt$(spent + net)}.
        ${best && best.saved ? `Most from ${best.name}.` : ''}
        ${unpriced ? '<br>Providers reporting only a billed total contribute tokens, not savings.' : ''}
      </div>
    </div>`;
}

function totalReportHtml(accounts) {
  const excluded = getReportExcluded();
  const includedAccounts = accounts.filter(account => !excluded.has(account.id));
  const periods = {
    today: sumPeriod(includedAccounts, 'today'),
    last7d: sumPeriod(includedAccounts, 'last7d'),
    month: sumPeriod(includedAccounts, 'month'),
    allTime: sumPeriod(includedAccounts, 'allTime'),
  };

  const rows = includedAccounts.map(account => ({
    account,
    index: accounts.findIndex(a => a.id === account.id),
    ...accountTotals(account)
  }));

  const range = reportRangeOf();
  const grandCost = periods.allTime.cost;
  const grandTokens = periods.allTime.tokens;
  const donut = donutChartHtml(rows, grandCost, grandTokens, 'tokens');

  // Cost stats row
  const costStats = [
    ['Today', periods.today],
    ['Last 7 days', periods.last7d],
    ['This month', periods.month],
    ['All time', periods.allTime],
  ].map(([label, value]) => `
    <div class="stat">
      <div class="label">${label}</div>
      <div class="value">${fmt$(value.cost)}</div>
      <div class="sub">${fmtTok(value.tokens)} tokens</div>
    </div>`).join('');

  const filters = accounts.map((account, index) => `
    <label class="report-filter" style="--filter-color:${reportColors[index % reportColors.length]}">
      <input type="checkbox" data-report-account="${account.id}" ${excluded.has(account.id) ? '' : 'checked'}>
      <span>${accountTitle(account)}</span>
    </label>`).join('');

  const models = topModels(includedAccounts);
  const modelRows = models.map((model, index) => `<tr>
    <td class="model-name"><span class="model-rank">${index + 1}</span>${model.name}</td>
    <td>${fmtTok(model.tokens)}</td><td>${fmt$(model.cost)}</td>
  </tr>`).join('');

  return `<div class="panel-heading">Total Reports</div>
    <div class="report-body">
      <div class="report-filters"><span class="report-filter-label">Include</span>${filters}</div>
      <div class="report-summary">${costStats}</div>
      <div class="report-insights">
        <div class="card bars-card">
          <h2 class="card-title">Tokens by account · all time</h2>
          ${donut}
        </div>
        ${usageTrendHtml(includedAccounts, range)}
      </div>
      <div class="report-lower">
        ${promptCacheHtml(includedAccounts) || '<div class="card"><h2 class="card-title">Prompt cache</h2><p class="empty">No cache data reported yet.</p></div>'}
        <div class="card top-models-card">
          <h2 class="card-title">Top 5 models · all time</h2>
          <div class="table-scroll"><table>
            <thead><tr><th>Model</th><th>Tokens</th><th>Cost</th></tr></thead>
            <tbody>${modelRows || '<tr><td colspan="3" class="empty">No included usage data</td></tr>'}</tbody>
          </table></div>
        </div>
      </div>
    </div>`;
}

document.addEventListener('change', (e) => {
  const reportAccount = e.target.closest('[data-report-account]');
  if (reportAccount) {
    setReportAccount(reportAccount.dataset.reportAccount, reportAccount.checked);
    return;
  }
  const ecoHideAccount = e.target.closest('[data-eco-hide-account]');
  if (ecoHideAccount) {
    toggleEcoHidden(ecoHideAccount.dataset.ecoHideAccount, ecoHideAccount.checked);
    return;
  }
  const t = e.target.closest('[data-toggle-account]');
  if (t) toggleHidden(t.dataset.toggleAccount, t.checked);
});

document.addEventListener('click', (e) => {
  const range = e.target.closest('[data-report-range]');
  if (range) {
    reportSetRange(Number(range.dataset.reportRange));
    const totalPanel = document.getElementById('panel-total');
    if (totalPanel) setHtml(totalPanel, totalReportHtml(lastAllAccounts));
    return;
  }
});

function donutDetailHtml(el) {
  const wrap = el.closest('[data-donut-metric]');
  const isTok = (wrap?.dataset?.donutMetric || 'tokens') === 'tokens';
  if (isTok) {
    return `<span class="donut-detail-name" title="${el.dataset.name}">${el.dataset.name}</span>
      <span class="donut-total">${el.dataset.tokens}</span>
      <span class="donut-detail-meta">${el.dataset.pct}% · ${el.dataset.cost}</span>`;
  }
  return `<span class="donut-detail-name" title="${el.dataset.name}">${el.dataset.name}</span>
    <span class="donut-total">${el.dataset.cost}</span>
    <span class="donut-detail-meta">${el.dataset.pct}% · ${el.dataset.tokens} tokens</span>`;
}

function donutSync(wrap, idx) {
  wrap.querySelectorAll('[data-seg-index]').forEach(seg => seg.classList.toggle('donut-fade', seg.dataset.segIndex !== idx));
  wrap.querySelectorAll('[data-legend-index]').forEach(row => row.classList.toggle('donut-fade', row.dataset.legendIndex !== idx));
}

function donutResetCenter(wrap) {
  const center = wrap.querySelector('.donut-center');
  if (!center) return;
  const pinned = wrap.dataset.pinned;
  if (pinned) {
    const el = wrap.querySelector(`[data-legend-index="${pinned}"]`);
    if (el) { center.innerHTML = donutDetailHtml(el); return; }
  }
  center.innerHTML = center.dataset.defaultCenter;
}

document.addEventListener('mouseover', (e) => {
  const hit = e.target.closest('[data-seg-index], [data-legend-index]');
  if (!hit) return;
  const wrap = hit.closest('.donut-wrap');
  if (!wrap) return;
  const idx = hit.dataset.segIndex != null ? hit.dataset.segIndex : hit.dataset.legendIndex;
  donutSync(wrap, idx);
  const center = wrap.querySelector('.donut-center');
  if (center) center.innerHTML = donutDetailHtml(hit);
});

document.addEventListener('mouseout', (e) => {
  const wrap = e.target.closest('.donut-wrap');
  if (!wrap || (e.relatedTarget && wrap.contains(e.relatedTarget))) return;
  wrap.querySelectorAll('.donut-fade').forEach(n => n.classList.remove('donut-fade'));
  donutResetCenter(wrap);
});

document.addEventListener('click', (e) => {
  const hit = e.target.closest('[data-seg-index], [data-legend-index]');
  const wrap = hit ? hit.closest('.donut-wrap') : document.querySelector('.donut-wrap');
  if (!wrap) return;
  if (!hit) {
    wrap.dataset.pinned = '';
    wrap.querySelectorAll('.pinned').forEach(n => n.classList.remove('pinned'));
    donutResetCenter(wrap);
    return;
  }
  const idx = hit.dataset.segIndex != null ? hit.dataset.segIndex : hit.dataset.legendIndex;
  if (wrap.dataset.pinned === idx) {
    wrap.dataset.pinned = '';
    wrap.querySelectorAll('.pinned').forEach(n => n.classList.remove('pinned'));
    donutResetCenter(wrap);
    return;
  }
  wrap.dataset.pinned = idx;
  wrap.querySelectorAll('.pinned').forEach(n => n.classList.remove('pinned'));
  wrap.querySelectorAll('[data-seg-index], [data-legend-index]').forEach(el => {
    const k = el.dataset.segIndex != null ? el.dataset.segIndex : el.dataset.legendIndex;
    el.classList.toggle('pinned', k === idx);
  });
  wrap.querySelector('.donut-center').innerHTML = donutDetailHtml(hit);
});


function statRow(section) {
  if (section.usageTracked === false) {
    return '<p class="empty">Antigravity exposes quota limits, not local cost history.</p>';
  }
  const periods = [
    { label: 'Today', data: section.today },
    { label: 'Last 7 days', data: section.last7d },
    { label: 'This month', data: section.month },
    { label: 'All time', data: section.allTime },
  ];
  const items = periods.map(period => ({
    label: period.label,
    value: fmt$(period.data.cost),
    sub: fmtTok(period.data.tokens) + ' tokens',
  }));
  return items.map(s => `
    <div class="stat">
      <div class="label">${s.label}</div>
      <div class="value">${s.value}</div>
      <div class="sub">${s.sub}</div>
    </div>`).join('');
}

function cell(cost, tokens) {
  return `<td>${fmt$4(cost)}<span class="tok-sub">${fmtTok(tokens)} tok</span></td>`;
}

function modelTable(models, opts = {}) {
  models = (models || []).filter(modelHasUsage);
  const writeLabel = opts.cacheWriteLabel || 'Cache write';
  const readLabel = opts.cacheReadLabel || 'Cache read';
  const reasoningColumn = !!opts.reasoningColumn;
  const head = `<thead><tr>
    <th>Model</th>
    <th>Input</th>
    <th>Output</th>
    <th>${writeLabel}</th>
    <th>${readLabel}</th>
    <th class="total-col">Total</th>
  </tr></thead>`;

  if (!models.length) {
    return head + '<tbody><tr><td colspan="6" class="empty">No data yet</td></tr></tbody>';
  }

  let body = '';
  const grand = { input: 0, output: 0, cacheWrite: 0, cacheRead: 0, total: 0 };
  const grandTok = { input: 0, output: 0, cacheWrite: 0, cacheRead: 0 };

  for (const m of models) {
    const c = m.cost, t = m.tokens;
    const writeCost = reasoningColumn ? 0 : c.cacheWrite;
    const writeTokens = reasoningColumn ? (t.reasoning || 0) : t.cacheWrite;
    grand.input += c.input; grand.output += c.output;
    grand.cacheWrite += writeCost; grand.cacheRead += c.cacheRead; grand.total += c.total;
    grandTok.input += t.input; grandTok.output += t.output;
    grandTok.cacheWrite += writeTokens; grandTok.cacheRead += t.cacheRead;
    body += `<tr>
      <td class="model-name">${m.modelName}</td>
      ${cell(c.input, t.input)}
      ${cell(c.output, t.output)}
      ${cell(writeCost, writeTokens)}
      ${cell(c.cacheRead, t.cacheRead)}
      <td class="total-col">${fmt$(c.total)}<span class="tok-sub">${fmtTok(t.input + t.output + (t.reasoning || 0) + t.cacheWrite + t.cacheRead)} tok</span></td>
    </tr>`;
  }

  body += `<tr class="totals-row">
    <td>Total</td>
    <td>${fmt$(grand.input)}<span class="tok-sub">${fmtTok(grandTok.input)} tok</span></td>
    <td>${fmt$(grand.output)}<span class="tok-sub">${fmtTok(grandTok.output)} tok</span></td>
    <td>${fmt$(grand.cacheWrite)}<span class="tok-sub">${fmtTok(grandTok.cacheWrite)} tok</span></td>
    <td>${fmt$(grand.cacheRead)}<span class="tok-sub">${fmtTok(grandTok.cacheRead)} tok</span></td>
    <td class="total-col">${fmt$(grand.total)}</td>
  </tr>`;

  return head + '<tbody>' + body + '</tbody>';
}

function fmtResetsAt(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const diffMs = d - new Date();
  if (diffMs <= 0) return `reset ${d.toLocaleDateString([], { month: 'short', day: 'numeric' })} · awaiting a fresh reading`;
  const hrs = diffMs / 3600000;
  if (hrs < 24) return `resets in ${Math.round(hrs)}h`;
  return `resets in ${Math.round(hrs / 24)}d (${d.toLocaleDateString([], { month: 'short', day: 'numeric' })})`;
}

function shortLimitLabel(label) {
  return String(label || '')
    .replace(/Claude and GPT models/gi, 'Claude/GPT')
    .replace(/Gemini Models/gi, 'Gemini')
    .replace(/\s*—\s*/g, ' · ')
    .replace(/Five Hour Limit/gi, '5h')
    .replace(/Weekly Limit/gi, 'Weekly')
    .replace(/\s+Limit$/i, '');
}

function limitItem(label, entry) {
  if (!entry) return '';
  const pct = entry.percent == null ? 0 : entry.percent;
  const cls = pct >= 90 ? 'bad' : pct >= 70 ? 'warn' : '';
  const pctLabel = entry.percent == null ? '—' : `${pct}%`;
  const detail = entry.used != null && entry.limit != null
    ? `${Number(entry.used).toLocaleString()} / ${Number(entry.limit).toLocaleString()}`
    : '';
  return `
    <div class="limit-item">
      <div class="head"><span>${shortLimitLabel(label)}</span><span class="pct">${pctLabel}</span></div>
      <div class="bar-track"><div class="bar-fill ${cls}" style="width:${entry.percent == null ? 0 : pct}%"></div></div>
      <div class="reset">${[detail, fmtResetsAt(entry.resetsAt)].filter(Boolean).join(' · ')}</div>
    </div>`;
}

const lastRefreshNoteByAccount = {};

function fmtExpiryDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString([], { year: 'numeric', month: 'short', day: 'numeric' });
}

function fmtExpiryDateTime(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleString([], {
    year: 'numeric', month: 'short', day: 'numeric',
    hour: 'numeric', minute: '2-digit',
  });
}

function fmtTimeLeft(iso) {
  if (!iso) return 'expiry unavailable';
  const remaining = new Date(iso).getTime() - Date.now();
  if (remaining <= 0) return 'expired';
  const totalMinutes = Math.ceil(remaining / 60000);
  const days = Math.floor(totalMinutes / 1440);
  const hours = Math.floor((totalMinutes % 1440) / 60);
  const minutes = totalMinutes % 60;
  if (days) return `${days}d ${hours}h ${minutes}m`;
  if (hours) return `${hours}h ${minutes}m`;
  return `${minutes}m`;
}

function creditsLine(credits) {
  if (!credits) return '';
  if (credits.monthlyLimit != null || credits.onDemandCap != null || credits.balance != null) {
    const parts = [];
    // Skip zeroed monthly pools (xAI unified billing returns 0/0).
    if (credits.monthlyLimit != null && credits.monthlyLimit > 0 && credits.monthlyUsed != null) {
      parts.push(`${credits.monthlyUsed.toLocaleString()} / ${credits.monthlyLimit.toLocaleString()} monthly credits`);
    }
    if (credits.balance) parts.push(`${credits.balance.toLocaleString()} prepaid`);
    if (credits.onDemandCap) {
      parts.push(`on-demand ${credits.onDemandUsed || 0} / ${credits.onDemandCap}`);
    }
    return parts.length ? `<div class="limit-stale">${parts.join(' · ')}</div>` : '';
  }
  const fmtRange = (r) => r ? `${r[0]}–${r[1]}` : null;
  const parts = [`${credits.balance} message credits left`];
  const local = fmtRange(credits.approxLocalMessages);
  const cloud = fmtRange(credits.approxCloudMessages);
  if (local) parts.push(`~${local} local msgs`);
  if (cloud) parts.push(`~${cloud} cloud msgs`);
  if (credits.expiresAt) parts.push(`expires ${fmtExpiryDate(credits.expiresAt)}`);
  return `<div class="limit-stale">${parts.join(' · ')}</div>`;
}

function resetsAvailableLine(resetsAvailable) {
  if (!resetsAvailable) return '';
  const parts = [`${resetsAvailable.available} manual limit reset${resetsAvailable.available === 1 ? '' : 's'} available`];
  if (resetsAvailable.expiresAt) {
    parts.push(`expires in <span class="manual-reset-time" data-countdown="${resetsAvailable.expiresAt}">${fmtTimeLeft(resetsAvailable.expiresAt)}</span> (${fmtExpiryDateTime(resetsAvailable.expiresAt)})`);
  } else {
    parts.push('expiry unavailable from Codex');
  }
  return `<div class="limit-stale manual-reset">${parts.join(' · ')}</div>`;
}

const LIMITLESS_PROVIDERS = new Set(['opencode', 'devin']);

function antigravityPoolLabel(items) {
  const labels = items.map(item => item.label.toLowerCase());
  const hasGemini = labels.some(label => label.includes('gemini'));
  const hasClaude = labels.some(label => label.includes('claude'));
  const hasGpt = labels.some(label => label.includes('gpt'));
  if (hasGemini && !hasClaude && !hasGpt) return 'Gemini models';
  if (!hasGemini && (hasClaude || hasGpt)) return hasClaude && hasGpt ? 'Claude / GPT models' : hasClaude ? 'Claude models' : 'GPT models';
  return `${items.length} shared model limits`;
}

function collapseAntigravityLimits(items) {
  const groups = new Map();
  for (const item of items) {
    const entry = item.entry || item.latest || {};
    const key = `${entry.percent ?? entry.pct ?? ''}|${entry.remainingPercent ?? ''}|${entry.resetsAt || ''}`;
    const group = groups.get(key) || [];
    group.push(item);
    groups.set(key, group);
  }
  return [...groups.values()].map(group => group.length === 1
    ? group[0]
    : { ...group[0], label: antigravityPoolLabel(group) });
}

function limitsCard(account, rateLimits) {
  // A note the user's own Refresh produced outranks one the server offered,
  // but an empty card with no explanation is the worst of the three.
  const note = lastRefreshNoteByAccount[account.id] || rateLimits?.note || '';
  const noteHtml = note ? `<div class="limit-stale">${esc(note)}</div>` : '';
  const labels = account.limitLabels || {};
  const sessionLabel = rateLimits?.session?.label || labels.session || 'Session (5h)';
  const weeklyLabel = rateLimits?.weekly?.label || labels.weekly || 'Weekly';
  let windowItems = (rateLimits?.windows?.length
    ? rateLimits.windows.map(w => ({ label: w.label, entry: w }))
    : [{ label: sessionLabel, entry: rateLimits?.session }, { label: weeklyLabel, entry: rateLimits?.weekly }]
  ).filter(item => item.entry);
  if (account.provider === 'antigravity') windowItems = collapseAntigravityLimits(windowItems);
  const hasWindows = windowItems.length > 0;
  const plan = rateLimits?.planLabel || rateLimits?.subscriptionTier || account.planLabel || '';
  const heading = plan
    ? `${providerName(account.provider)} · ${plan}`
    : `${providerName(account.provider)} limits`;
  const freshness = limitFreshness(account, rateLimits);
  const unifiedNote = rateLimits?.unifiedBilling && !rateLimits?.session
    ? `<div class="limit-stale">Unified billing — weekly GrokBuild quota (no separate monthly credit pool)</div>`
    : '';
  if (LIMITLESS_PROVIDERS.has(account.provider)) {
    return `
      <div class="limits-head"><h2 class="card-title">${heading}</h2></div>
      <p class="empty">No subscription limits to show — usage is read locally from the ${providerName(account.provider)} database.</p>${noteHtml}${freshness}`;
  }
  if (rateLimits?.error) {
    return `
      <div class="limits-head"><h2 class="card-title">${heading}</h2>${refreshButton(account.id)}</div>
      <p class="empty">Couldn't fetch live limits: ${esc(rateLimits.error)}</p>${noteHtml}`;
  }
  if (!rateLimits || !hasWindows) {
    return `
      <div class="limits-head"><h2 class="card-title">${heading}</h2>${refreshButton(account.id)}</div>
      <p class="empty">No usage data yet.</p>${unifiedNote}${noteHtml}${freshness}${rateLimits ? resetsAvailableLine(rateLimits.resetsAvailable) : ''}${rateLimits ? creditsLine(rateLimits.credits) : ''}`;
  }
  return `
    <div class="limits-head"><h2 class="card-title">${heading}</h2>${refreshButton(account.id)}</div>
    <div class="limits-grid">
      ${windowItems.map(item => limitItem(item.label, item.entry)).join('')}
    </div>
    ${unifiedNote}${noteHtml}${freshness}${creditsLine(rateLimits.credits)}${resetsAvailableLine(rateLimits.resetsAvailable)}`;
}

function refreshButton(id) {
  return `<button class="refresh-btn" data-account="${id}" title="Force a live check now">Refresh</button>`;
}

function limitFreshness(account, rateLimits) {
  if (!rateLimits || rateLimits.live) return '';
  if (account.provider === 'grok') {
    const age = rateLimits.ageMinutes == null ? 'unknown age' : `${rateLimits.ageMinutes}m old`;
    return `<div class="limit-stale">Cached xAI reading · ${age}</div>`;
  }
  if (account.provider === 'antigravity') {
    const age = rateLimits.ageMinutes == null ? 'unknown age' : `${rateLimits.ageMinutes}m old`;
    return `<div class="limit-stale">Cached Google quota · ${age}</div>`;
  }
  return '';
}

function updateCountdowns() {
  document.querySelectorAll('[data-countdown]').forEach((el) => {
    el.textContent = fmtTimeLeft(el.dataset.countdown);
  });
}

let refreshing = false;
async function refreshLimits(accountId) {
  if (refreshing) return;
  refreshing = true;
  document.querySelectorAll('.refresh-btn').forEach(b => { b.disabled = true; });
  const btn = document.querySelector(`.refresh-btn[data-account="${accountId}"]`);
  if (btn) btn.textContent = '…';
  try {
    const res = await fetch('/api/refresh-limits?id=' + encodeURIComponent(accountId), { method: 'POST' });
    const result = await res.json();
    const time = new Date().toLocaleTimeString();
    const r = result[accountId];
    lastRefreshNoteByAccount[accountId] = (r?.live ? 'refreshed live' : 'still rate-limited, showing last known reading') + ' (' + time + ')';
  } catch {
    lastRefreshNoteByAccount[accountId] = 'Refresh request failed — dashboard server may be down.';
  } finally {
    refreshing = false;
    load();
  }
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('.refresh-btn');
  if (btn) refreshLimits(btn.dataset.account);
});

document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  setActiveTab(btn.dataset.id);
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === btn));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + btn.dataset.id));
});

// --- Limit economics ---------------------------------------------------------
// Providers report a percentage consumed, never what that percentage is worth.
// The server's ledger pairs each percentage reading with the token and dollar
// counters standing at that moment, so the exchange rate — tokens and dollars
// per one percent — falls out of the slope between readings inside a window.

let limitHistoryData = null;

const ECO_HIDDEN_KEY = 'ccu-eco-hidden-accounts';
function getEcoHidden() {
  try { return new Set(JSON.parse(localStorage.getItem(ECO_HIDDEN_KEY) || '[]')); } catch { return new Set(); }
}
function toggleEcoHidden(accountId, visible) {
  const hidden = getEcoHidden();
  if (visible) hidden.delete(accountId); else hidden.add(accountId);
  localStorage.setItem(ECO_HIDDEN_KEY, JSON.stringify([...hidden]));
  renderLimitEconomics();
}

// Percentages arrive as whole numbers, so a rate measured across only a point
// or two carries up to ±50% quantisation error. Below this many measured
// points a seven-day estimate is the better answer where one is available.
const ECO_MIN_PCT = 5;

const ecoMetricOf = () => localStorage.getItem('ccu-eco-metric') === 'tokens' ? 'tokens' : 'cost';
const ecoSetMetric = (m) => localStorage.setItem('ccu-eco-metric', m);

const ecoRate = (o, metric) => o ? (metric === 'tokens' ? o.tokensPerPct : o.costPerPct) : null;
const ecoTotal = (o, metric) => o ? (metric === 'tokens' ? o.tokens : o.cost) : null;

// Per-percent dollar figures are often well under a cent, where two decimals
// would round every window to the same number.
const ecoFmt = (v, metric) => v == null
  ? '—'
  : metric === 'tokens' ? fmtTok(v) : (v >= 0.1 ? fmt$(v) : fmt$4(v));

const ecoDate = (iso) => iso
  ? new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
  : '—';

// A seven-day window and the "last 7 days" totals cover very nearly the same
// span, so their ratio approximates the per-percent rate before the ledger has
// watched a percentage move. It only holds where one window governs the
// account's whole usage, which is why callers pass `allowed`.
function ecoEstimate(account, win, metric, allowed) {
  const pct = win.latest?.pct ?? 0;
  if (!allowed || pct <= 0 || !account.last7d) return null;
  const total = metric === 'tokens' ? account.last7d.tokens : account.last7d.cost;
  return total ? total / pct : null;
}

const ECO_W = 640;
const ECO_H = 150;
const ECO_PAD = { l: 52, r: 12, t: 16, b: 22 };
const ECO_PLOT_W = ECO_W - ECO_PAD.l - ECO_PAD.r;
const ECO_PLOT_H = ECO_H - ECO_PAD.t - ECO_PAD.b;

function ecoAxis(ticks, metric) {
  return ticks.map(({ v, y }) => `
    <line class="eco-grid-line" x1="${ECO_PAD.l}" x2="${ECO_W - ECO_PAD.r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"></line>
    <text class="eco-axis-text" x="${ECO_PAD.l - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end">${v === 0 ? '0' : ecoFmt(v, metric)}</text>`).join('');
}

function ecoChartFrame(key, caption, body) {
  return `<div class="eco-chart-wrap" data-eco-chart="${key}">
    <p class="eco-chart-caption">${caption}</p>
    <svg class="eco-chart" viewBox="0 0 ${ECO_W} ${ECO_H}" role="img" aria-label="${esc(caption)}">${body}</svg>
    <div class="eco-tip"></div>
  </div>`;
}

// One chart form for every card: bars of what a single percentage point cost.
// Only the x-unit adapts — a completed window where several exist, otherwise
// each individual percentage tick — so Codex's months of history and Claude's
// first few points are read exactly the same way.
function ecoBars(items, metric, key, caption) {
  items = items.filter(i => Number.isFinite(i.value) && i.value > 0);
  if (!items.length) return '<p class="eco-empty">No spend recorded against this limit yet — the percentage moved but the priced usage behind it is zero.</p>';
  const values = items.map(i => i.value);
  const peak = Math.max(...values);
  const top = peak * 1.15;
  const y = v => ECO_PAD.t + ECO_PLOT_H - (v / top) * ECO_PLOT_H;
  // A handful of bars spread across the full width reads as a sparse chart
  // rather than a filling one, so short series keep a fixed column width and
  // grow rightwards into the empty space.
  const slot = Math.min(ECO_PLOT_W / items.length, items.length < 6 ? 64 : Infinity);
  const barW = Math.max(6, Math.min(44, slot - 8));
  const peakIdx = values.indexOf(peak);

  const bars = items.map((item, i) => {
    const x = ECO_PAD.l + i * slot + (slot - barW) / 2;
    const yTop = y(item.value);
    const h = Math.max(2, ECO_PAD.t + ECO_PLOT_H - yTop);
    const r = Math.min(4, barW / 2, h);
    // Rounded top corners only — the baseline end stays square on the axis.
    const d = `M${x.toFixed(1)} ${(yTop + h).toFixed(1)} V${(yTop + r).toFixed(1)} Q${x.toFixed(1)} ${yTop.toFixed(1)} ${(x + r).toFixed(1)} ${yTop.toFixed(1)} H${(x + barW - r).toFixed(1)} Q${(x + barW).toFixed(1)} ${yTop.toFixed(1)} ${(x + barW).toFixed(1)} ${(yTop + r).toFixed(1)} V${(yTop + h).toFixed(1)} Z`;
    // Only the peak and the newest bar are labelled; the table carries the rest.
    const label = (i === peakIdx || i === items.length - 1)
      ? `<text class="eco-mark-text" x="${(x + barW / 2).toFixed(1)}" y="${(yTop - 5).toFixed(1)}">${ecoFmt(item.value, metric)}</text>`
      : '';
    // Keep at most ~10 x labels (always including the newest) so dates never
    // overprint each other on long histories.
    const every = Math.ceil(items.length / 10);
    const xLabel = ((items.length - 1 - i) % every === 0)
      ? `<text class="eco-axis-text" x="${(x + barW / 2).toFixed(1)}" y="${ECO_H - 7}" text-anchor="middle">${item.x}</text>`
      : '';
    return `<g><path class="eco-bar" data-eco-bar="${key}-${i}" d="${d}"></path>${label}${xLabel}
      <rect class="eco-hit" data-eco-key="${key}-${i}" data-eco-tip="${esc(item.tip)}" x="${(ECO_PAD.l + i * slot).toFixed(1)}" y="${ECO_PAD.t}" width="${slot.toFixed(1)}" height="${ECO_PLOT_H}"></rect></g>`;
  }).join('');

  const ticks = [0, top / 2, top].map(v => ({ v, y: y(v) }));
  return ecoChartFrame(key, caption, ecoAxis(ticks, metric) + bars);
}

// Long histories are summarised one bar per window; a window still filling up
// is broken out tick by tick so there is something to read on day one.
const ECO_MAX_TICKS = 24;

function ecoChart(win, metric, key) {
  const unit = metric === 'tokens' ? 'Tokens' : 'Dollars';
  const windows = win.cycles.filter(c => ecoRate(c, metric) > 0);
  if (windows.length >= 1) {
    const items = windows.slice().reverse().map(c => ({
      value: ecoRate(c, metric),
      x: c.cycle === win.latest?.cycle ? 'now' : ecoDate(c.resetsAt || c.to),
      tip: `${ecoFmt(ecoRate(c, metric), metric)} per 1% · ${c.pctStart}→${c.pctEnd}%${c.partial ? ' (partial)' : ''} · ${fmtTok(c.tokens)} / ${fmt$(c.cost)} · ${c.cycle === win.latest?.cycle ? 'current window' : `reset ${ecoDate(c.resetsAt || c.to)}`}`,
    }));
    return ecoBars(items, metric, key, `${unit} per 1%, by window (labelled by reset date)`);
  }
  const steps = (win.steps || []).slice(-ECO_MAX_TICKS);
  if (steps.length) {
    const items = steps.map(s => ({
      value: metric === 'tokens' ? s.tokensPerPct : s.costPerPct,
      x: `${s.toPct}%`,
      tip: `${s.fromPct}→${s.toPct}% · ${fmtTok(s.tokens)} / ${fmt$(s.cost)} · ${ecoDate(s.t)}`,
    }));
    // "Completed" matters: a bar covers the spend that carried one point to the
    // next, while the headline rate also counts spend sitting on the current
    // point, so the two only converge as points accumulate.
    return ecoBars(items, metric, key, `${unit} per 1%, by completed percentage point`);
  }
  return '<p class="eco-empty">Nothing plotted yet — the first bar appears once the percentage moves.</p>';
}

function ecoCard(account, win, metric, allowEstimate) {
  const key = `${account.id}--${win.key}`;
  // `lifetime` is now the recent pool (newest 5 complete windows) where
  // available; `lifetimeAll` keeps the all-time mean for the cross-check.
  const pooled = win.lifetime;
  const allPool = win.lifetimeAll || null;
  const current = win.current;
  const measured = ecoRate(pooled, metric) > 0 ? ecoRate(pooled, metric) : null;
  const estimate = ecoEstimate(account, win, metric, allowEstimate);
  const pts = pooled ? pooled.pct : 0;
  // A partial cycle opens mid-window, so its slope skips the spend that
  // already happened before the ledger base — the rate only becomes
  // trustworthy once a complete cycle (observed from 0%) is in the pool.
  const completeCycles = win.cycles.some(c => !c.partial && ecoRate(c, metric) > 0);
  const trusted = measured != null && pts >= ECO_MIN_PCT && completeCycles;
  const rate = trusted ? measured : (estimate != null ? estimate : measured);
  const mode = trusted ? 'measured' : (estimate != null ? 'estimated' : (measured != null ? 'provisional' : 'none'));
  const pct = win.latest?.pct ?? 0;
  const barCls = pct >= 90 ? 'bad' : pct >= 70 ? 'warn' : '';

  const isRecent = !!(allPool && pooled && pooled.cycles !== allPool.cycles);
  const why = {
    measured: () => isRecent
      ? `measured across ${pooled.cycles} recent window${pooled.cycles === 1 ? '' : 's'} and ${Math.round(pts)} points (all-time ${allPool.cycles} windows would be ${ecoFmt(allPool ? ecoRate(allPool, metric) : null, metric)}/1%)`
      : `measured across ${pooled.cycles} window${pooled.cycles === 1 ? '' : 's'} and ${Math.round(pts)} percentage points`,
    estimated: () => `last 7 days ÷ ${pct}% consumed — tracking began mid-window, so a measured rate takes over once a full window is seen`,
    provisional: () => `only ${Math.round(pts)} point${Math.round(pts) === 1 ? '' : 's'} measured — whole-number percentages make this imprecise so far`,
    none: () => 'no rate yet — it appears once the percentage moves',
  }[mode]();
  const costBasisNote = account.provider === 'codex' && metric === 'cost'
    ? '<span class="eco-badge" title="Estimated at published API token rates; separate from your ChatGPT plan price">API equivalent</span> · '
    : '';

  const allMeasured = allPool ? ecoRate(allPool, metric) : null;
  const stats = [
    { label: 'Full window', value: ecoFmt(rate != null ? rate * 100 : null, metric), sub: isRecent ? 'recent windows' : 'at this rate' },
    {
      label: 'This window',
      value: current && current.pctSpan > 0 ? ecoFmt(ecoTotal(current, metric), metric) : '—',
      sub: current && current.pctSpan > 0 ? `over ${current.pctSpan}%` : 'not moved yet',
    },
    isRecent && allMeasured != null
      ? { label: 'All-time', value: ecoFmt(allMeasured, metric), sub: `${allPool.cycles} windows` }
      : mode === 'estimated' && measured != null
        ? { label: 'Measured', value: ecoFmt(measured, metric), sub: `${Math.round(pts)} pt${Math.round(pts) === 1 ? '' : 's'} so far` }
        : mode === 'measured' && estimate != null
          ? { label: 'Cross-check', value: ecoFmt(estimate, metric), sub: 'from last 7 days' }
          : { label: 'Windows seen', value: pooled ? String(pooled.cycles) : '0', sub: 'with a measurable rate' },
  ];

  const rows = win.cycles.filter(c => ecoRate(c, metric) > 0);
  const table = rows.length >= 2 ? `<details class="eco-details" data-eco-details="${esc(key)}">
      <summary>Window breakdown (${rows.length} entries)</summary>
      <div class="table-scroll"><table class="eco-table">
      <thead><tr><th>Window</th><th>Span</th><th>Tokens</th><th>Cost</th><th>Tok / 1%</th><th>$ / 1%</th></tr></thead>
      <tbody>${rows.map(c => `<tr>
        <td>${ecoDate(c.from)} – ${ecoDate(c.to)}${c.cycle === win.latest?.cycle ? ' <span class="dim">(current)</span>' : ''}</td>
        <td class="${c.partial ? 'dim' : ''}">${c.pctStart}→${c.pctEnd}%</td>
        <td>${fmtTok(c.tokens)}</td>
        <td>${fmt$(c.cost)}</td>
        <td>${ecoFmt(c.tokensPerPct, 'tokens')}</td>
        <td>${ecoFmt(c.costPerPct, 'cost')}</td>
      </tr>`).join('')}</tbody></table></div></details>` : '';

  return `<div class="card eco-card" style="--eco-accent:var(${accentVar(account.provider)})">
    <div class="limits-head">
      <h2 class="card-title">${esc(accountTitle(account))} · ${esc(win.label)}</h2>
      <div class="eco-toolbar">
        <button class="eco-toggle${metric === 'tokens' ? ' active' : ''}" data-eco-metric="tokens">Tokens</button>
        <button class="eco-toggle${metric === 'cost' ? ' active' : ''}" data-eco-metric="cost">Dollars</button>
      </div>
    </div>
    <div class="eco-top">
      <div>
        <div class="eco-rate">
          <span class="value">${ecoFmt(rate, metric)}</span>
          <span class="unit">per 1%</span>
          ${mode === 'measured' || mode === 'none' ? '' : `<span class="eco-badge">${mode}</span>`}
        </div>
        <p class="eco-why">${costBasisNote}${why}${current && current.mixedLogins
          ? ' · <span class="eco-flag">two logins seen in this window — its rate mixes both</span>'
          : ''}</p>
      </div>
      <div class="limit-item eco-meter">
        <div class="head"><span>consumed</span><span class="pct">${pct}%</span></div>
        <div class="bar-track"><div class="bar-fill ${barCls}" style="width:${Math.min(100, pct)}%"></div></div>
        <div class="reset">${win.latest?.resetsAt ? fmtResetsAt(win.latest.resetsAt) : ''}</div>
      </div>
    </div>
    <div class="stat-row">${stats.map(s => `
      <div class="stat"><div class="label">${s.label}</div><div class="value">${s.value}</div><div class="sub">${s.sub}</div></div>`).join('')}</div>
    ${ecoChart(win, metric, key)}
    ${table}
  </div>`;
}

// Compute the provider with the most tokens across a set of accounts.
function topProviderByTokens(accounts) {
  const byProvider = new Map();
  for (const a of accounts) {
    const name = providerName(a.provider);
    const tokens = Number(a.allTime?.tokens) || 0;
    byProvider.set(name, (byProvider.get(name) || 0) + tokens);
  }
  if (!byProvider.size) return null;
  let topName = null, topTok = 0;
  for (const [name, tok] of byProvider) {
    if (tok > topTok) { topTok = tok; topName = name; }
  }
  return topName ? { name: topName, tokens: topTok } : null;
}

function economicsWindowsFor(account, windows) {
  const weekly = windows.filter(win => /weekly/i.test(win.key) || /weekly/i.test(win.label) || win.key === 'weekly');
  if (account.provider === 'codex') {
    // Only the weekly lane is measured. Other observed durations (a 30d
    // reading appeared briefly) stay out instead of being mislabeled as weekly.
    return weekly;
  }
  if (account.provider !== 'antigravity') return weekly.length ? weekly : windows;

  // Antigravity reports one row per reasoning tier even when every tier draws
  // from the same quota pool. Keep only the current generation of readings,
  // then collapse identical percentages/reset times into the shared pool they
  // actually represent.
  const newest = Math.max(0, ...windows.map(win => Date.parse(win.latest?.t || 0) || 0));
  const current = windows.filter(win => !newest || newest - (Date.parse(win.latest?.t || 0) || 0) < 36 * 60 * 60 * 1000);
  return collapseAntigravityLimits(current.map(win => ({ ...win, entry: win.latest }))).map(win => {
    const { entry, ...rest } = win;
    return rest;
  });
}

function limitEconomicsHtml(history) {
  if (!history) return '<p class="empty">Loading limit history…</p>';
  if (history.error) return `<p class="empty">${esc(history.error)}</p>`;
  const metric = ecoMetricOf();
  const ecoHidden = getEcoHidden();
  const byId = new Map((lastAllAccounts || []).map(a => [a.id, a]));

  // Account-level switches matter here: two Codex profiles can have unrelated
  // plans and economics, so hiding a whole provider is too blunt.
  const availableAccounts = [];
  const cards = [];

  for (const entry of (history.accounts || [])) {
    const account = byId.get(entry.id) || { id: entry.id, provider: entry.provider, label: entry.id };
    const windowsToUse = economicsWindowsFor(account, entry.windows || []);
    if (!windowsToUse.length) continue;

    availableAccounts.push(account);

    if (ecoHidden.has(account.id)) continue;

    for (const win of windowsToUse) {
      const allowEstimate = win.key === 'weekly' || /weekly/i.test(win.label || '');
      cards.push({ acct: entry.id, winKey: win.key, html: ecoCard(account, win, metric, allowEstimate) });
    }
  }

  // Top provider by tokens across all accounts in limit history (even hidden ones)
  const allEcoAccounts = (history.accounts || []).map(e => byId.get(e.id)).filter(Boolean);
  const top = topProviderByTokens(allEcoAccounts);
  const topBadge = top
    ? `<span class="eco-top-badge"><span class="eco-top-dot dot ${dotClass(allEcoAccounts.find(a=>providerName(a.provider)===top.name)?.provider||'')}"></span>${esc(top.name)} · ${fmtTok(top.tokens)} tokens</span>`
    : '';

  const accountToggles = availableAccounts.map(a => `
    <label class="eco-filter" style="--filter-color:var(${accentVar(a.provider)})">
      <input type="checkbox" data-eco-hide-account="${a.id}" ${ecoHidden.has(a.id) ? '' : 'checked'}>
      <span><span class="eco-top-dot dot ${dotClass(a.provider)}"></span>${accountTitle(a)}</span>
    </label>`).join('');

  // The shell is a fixed-height layout with every panel set to overflow:hidden,
  // so this panel carries its own scroll region under a pinned heading.
  return `<div class="eco-panel-head">
      <div class="panel-heading" style="margin:0">Limit economics</div>
      <div class="eco-head-right">
        ${topBadge}
        <div class="eco-provider-filters" aria-label="Limit economics accounts">${accountToggles}</div>
      </div>
    </div>
    <div class="eco-scroll">
      ${cards.length ? cards.map(c => c.html).join('') : '<p class="empty">No limit readings recorded yet — or all providers hidden.</p>'}
    </div>`;
}

// Metric toggle and chart hover, delegated so re-renders need no rebinding.
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-eco-metric]');
  if (!btn) return;
  ecoSetMetric(btn.dataset.ecoMetric);
  renderLimitEconomics();
});

document.addEventListener('mousemove', (e) => {
  const hit = e.target.closest('[data-eco-key]');
  const wrap = hit ? hit.closest('.eco-chart-wrap') : e.target.closest('.eco-chart-wrap');
  document.querySelectorAll('.eco-chart-wrap').forEach(w => {
    if (w !== wrap) {
      w.classList.remove('hovering');
      w.querySelector('.eco-tip')?.classList.remove('show');
    }
  });
  if (!wrap) return;
  const tip = wrap.querySelector('.eco-tip');
  if (!hit) {
    wrap.classList.remove('hovering');
    tip?.classList.remove('show');
    return;
  }
  wrap.classList.add('hovering');
  wrap.querySelectorAll('.eco-bar').forEach(bar => bar.classList.toggle('hot', bar.dataset.ecoBar === hit.dataset.ecoKey));
  if (!tip) return;
  const box = wrap.getBoundingClientRect();
  tip.textContent = hit.dataset.ecoTip;
  tip.style.left = Math.max(70, Math.min(box.width - 70, e.clientX - box.left)) + 'px';
  tip.style.top = (e.clientY - box.top) + 'px';
  tip.classList.add('show');
});

function renderLimitEconomics() {
  const el = document.getElementById('panel-limits');
  if (!el) return;
  // Preserve which breakdowns are open and the scroll position across the
  // periodic re-render.
  const open = new Set([...el.querySelectorAll('details[open][data-eco-details]')].map(d => d.dataset.ecoDetails));
  const scroll = el.querySelector('.eco-scroll')?.scrollTop || 0;
  if (!setHtml(el, limitEconomicsHtml(limitHistoryData))) return;
  el.querySelectorAll('details[data-eco-details]').forEach(d => { if (open.has(d.dataset.ecoDetails)) d.open = true; });
  const sc = el.querySelector('.eco-scroll');
  if (sc) sc.scrollTop = scroll;
}

// Writes innerHTML only when it changed; returns whether it did.
function setHtml(el, html) {
  if (el._html === html) return false;
  el.innerHTML = html;
  el._html = html;
  return true;
}

async function loadLimitHistory() {
  try {
    const res = await fetch('/api/limit-history');
    limitHistoryData = await res.json();
  } catch (e) {
    limitHistoryData = { error: 'Could not load limit history: ' + e.message };
  }
  renderLimitEconomics();
}
function ensureLayout(allAccounts, visibleAccounts) {
  const missingEl = visibleAccounts.some(a => !document.getElementById(`stats-${a.id}`) || !document.getElementById(`models-${a.id}`));
  const key = allAccounts.map(a => a.id).join(',') + '|' + [...getHidden()].sort().join(',');
  if (key === builtForIds && !missingEl) return;
  builtForIds = key;

  const wasActiveId = document.querySelector('.tab.active')?.dataset.id;
  const preferredId = getActiveTab() || wasActiveId;
  const isVisibleAccount = preferredId && visibleAccounts.some(a => a.id === preferredId);
  const activeId = preferredId === 'settings' || preferredId === 'total' || preferredId === 'limits' || isVisibleAccount
    ? preferredId
    : 'total';

  document.getElementById('tabs').innerHTML =
    `<button class="tab report-tab${activeId === 'total' ? ' active' : ''}" data-id="total"><span class="dot"></span>Total Reports</button>` +
    `<button class="tab report-tab${activeId === 'limits' ? ' active' : ''}" data-id="limits"><span class="dot"></span>Limit Economics</button>` +
    visibleAccounts.map(a => `
      <button class="tab${a.id === activeId ? ' active' : ''}" data-id="${a.id}" style="--tab-accent:var(${accentVar(a.provider)})">
        <span class="dot ${dotClass(a.provider)}"></span>${accountTitle(a)}
      </button>`).join('') +
    `<button class="tab settings-tab${activeId === 'settings' ? ' active' : ''}" data-id="settings">Settings</button>`;

  document.getElementById('panels').innerHTML =
    `<div class="panel${activeId === 'total' ? ' active' : ''}" id="panel-total">${totalReportHtml(allAccounts)}</div>` +
    `<div class="panel${activeId === 'limits' ? ' active' : ''}" id="panel-limits">${limitEconomicsHtml(limitHistoryData)}</div>` +
    visibleAccounts.map(a => `
      <div class="panel${a.id === activeId ? ' active' : ''}" id="panel-${a.id}" style="--tab-accent:var(${accentVar(a.provider)})">
        <div class="panel-heading"><span class="dot ${dotClass(a.provider)}"></span>${accountTitle(a)}</div>
        ${a.usageSources?.length > 1 ? `<p class="usage-sources">Includes ${a.usageSources.slice(1).map(esc).join(' + ')}</p>` : ''}
        <p class="limit-stale usage-error" id="usage-error-${a.id}" hidden></p>
        ${LIMITLESS_PROVIDERS.has(a.provider) ? '' : `<div class="card" id="limits-${a.id}"></div>`}
        <div class="stat-row" id="stats-${a.id}"></div>
         <div class="card models-card${a.provider === 'opencode' ? ' opencode-models-card' : ''}">
           <h2 class="card-title">Cost by model</h2>
           <div class="table-scroll"><table id="models-${a.id}"></table></div>
        </div>
      </div>`).join('') +
    `<div class="panel${activeId === 'settings' ? ' active' : ''}" id="panel-settings">${settingsPanelHtml(allAccounts)}</div>`;
}

let lastFetchedAt = null;

async function load() {
  const res = await fetch('/api/usage');
  const data = await res.json();
  render(data);
}

function render(data) {
  lastFetchedAt = data.fetchedAt;
  document.getElementById('updated').textContent = 'updated ' + new Date(data.fetchedAt).toLocaleTimeString();
  if (!data.accounts || !data.accounts.length) {
    document.getElementById('tabs').innerHTML = '';
    document.getElementById('panels').innerHTML = '<p class="empty">No Claude, Codex, Grok, Antigravity, OpenCode, or Devin accounts detected on this machine.</p>';
    return;
  }

  lastAllAccounts = data.accounts;
  const hidden = getHidden();
  const visible = data.accounts.filter(a => !hidden.has(a.id));

  ensureLayout(data.accounts, visible);

  const totalPanel = document.getElementById('panel-total');
  if (totalPanel) setHtml(totalPanel, totalReportHtml(data.accounts));
  renderLimitEconomics();

  for (const a of visible) {
    const limitsEl = document.getElementById(`limits-${a.id}`);
    const statsEl = document.getElementById(`stats-${a.id}`);
    const modelsEl = document.getElementById(`models-${a.id}`);
    const usageErrorEl = document.getElementById(`usage-error-${a.id}`);
    if (usageErrorEl) {
      usageErrorEl.textContent = a.usageError ? `Token history unavailable: ${a.usageError}` : '';
      usageErrorEl.hidden = !a.usageError;
    }
    if (limitsEl) setHtml(limitsEl, limitsCard(a, a.rateLimits));
    if (statsEl) setHtml(statsEl, statRow(a));
    if (modelsEl) {
      const tableOpts = a.provider === 'grok'
        ? { cacheWriteLabel: 'Reasoning', cacheReadLabel: 'Cache read' }
        : a.provider === 'opencode' || a.provider === 'antigravity'
          ? { cacheWriteLabel: 'Reasoning', cacheReadLabel: 'Cache read', reasoningColumn: true }
          : {};
      setHtml(modelsEl, modelTable(a.models || [], tableOpts));
    }
  }
  updateCountdowns();
}

window.onerror = (msg, src, line, col, err) => {
  const panels = document.getElementById('panels');
  if (panels && !panels.querySelector('.js-error')) {
    const div = document.createElement('div');
    div.className = 'js-error';
    div.style.cssText = 'padding:1rem;background:#bf493f22;border:1px solid #bf493f;border-radius:8px;font-family:monospace;font-size:0.78rem;color:#bf493f;margin:1rem';
    div.textContent = `JS Error: ${msg} (line ${line})`;
    panels.prepend(div);
  }
  return false;
};
load().catch(e => {
  const panels = document.getElementById('panels');
  if (panels) panels.innerHTML = `<p class="empty" style="color:var(--bad)">Failed to load usage data: ${esc(e.message)}</p>`;
});
loadLimitHistory();
setInterval(load, 30000);
// The ledger only gains a row when a percentage ticks or on its 30-minute
// heartbeat, so polling it as often as the live usage view would be wasted.
setInterval(loadLimitHistory, 120000);
setInterval(updateCountdowns, 1000);
</script>
</body>
</html>
